name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # --- MSVC (informational until first green) --------------------------------
  # This path has never compiled anywhere: m93p has no Visual Studio, so CI is
  # its only test bench. Kept non-blocking until it has gone green once; the
  # clang jobs below are the authoritative signal meanwhile.
  msvc:
    runs-on: windows-2022
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        preset: [x64-debug, x64-release]

    defaults:
      run:
        shell: pwsh
        working-directory: src

    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      # Tee the build so a failure can be summarized: GitHub truncates very
      # large step logs, which previously hid the actual errors.
      # -- verbosity:quiet keeps MSBuild's per-project/per-file chatter out of
      # the step log (pages of it); the full output still lands in the log file
      # and is uploaded as an artifact on failure.
      - name: Build
        run: |
          cmake --build --preset ${{ matrix.preset }} -- -verbosity:quiet -consoleLoggerParameters:NoSummary 2>&1 |
            Tee-Object -FilePath ../build-msvc.log
          exit $LASTEXITCODE

      - name: Error summary
        if: failure()
        run: |
          Write-Host "=== error lines ==="
          Select-String -Path ../build-msvc.log -Pattern 'error [A-Z]+[0-9]+|fatal error' |
            Select-Object -First 60 | ForEach-Object { $_.Line }

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-msvc-${{ matrix.preset }}
          path: build-msvc.log
          if-no-files-found: ignore

      - name: Verify no dynamic CRT dependency
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" |
            Sort-Object FullName | Select-Object -Last 1
          $deps = & $dumpbin.FullName /dependents ..\bin\WORD1.exe
          $deps
          if ($deps -match 'vcruntime|msvcp\d+\.dll|ucrtbase|api-ms-win-crt') {
            throw "WORD1.exe (${{ matrix.preset }}) still imports the dynamic MSVC runtime."
          }

      - name: Test (headless)
        run: |
          $config = if ('${{ matrix.preset }}' -eq 'x64-debug') { 'Debug' } else { 'Release' }
          ctest --test-dir ..\out -C $config --output-on-failure -E '^opus_word1_'

      - name: Test (UI, informational)
        continue-on-error: true
        run: |
          $config = if ('${{ matrix.preset }}' -eq 'x64-debug') { 'Debug' } else { 'Release' }
          ctest --test-dir ..\out -C $config --output-on-failure -R '^opus_word1_'

      - name: Upload WORD1.exe
        uses: actions/upload-artifact@v4
        with:
          name: WORD1-msvc-${{ matrix.preset }}
          path: |
            bin/WORD1.exe
            build/pdb/**/WORD1.pdb
          if-no-files-found: error

  # --- clang / mingw-w64, x64 ------------------------------------------------
  # Mirrors the proven m93p configuration exactly (MSYS2 MINGW64 clang). This
  # is the configuration the project is developed and verified against.
  clang-x64:
    runs-on: windows-2022

    defaults:
      run:
        shell: msys2 {0}
        working-directory: src

    steps:
      - uses: actions/checkout@v5

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Configure
        run: cmake --preset x64-clang-mingw-debug

      - name: Build
        run: |
          set -o pipefail
          cmake --build --preset x64-clang-mingw-debug 2>&1 | tee ../build-x64.log

      - name: Error summary
        if: failure()
        run: |
          echo "=== error lines ==="
          grep -E "error:|FAILED|undefined reference" ../build-x64.log | head -60 || true

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-x64
          path: build-x64.log
          if-no-files-found: ignore

      - name: Test (headless)
        run: ctest --test-dir ../out-clang-mingw -C Debug --output-on-failure -E '^opus_word1_'

      - name: Test (UI, informational)
        continue-on-error: true
        run: ctest --test-dir ../out-clang-mingw -C Debug --output-on-failure -R '^opus_word1_'

      - name: Upload WORD1.exe
        uses: actions/upload-artifact@v4
        with:
          name: WORD1-clang-x64
          path: bin/WORD1.exe
          if-no-files-found: error

  # --- clang / mingw-w64, ARM64 (native) -------------------------------------
  # windows-11-arm runners are genuine ARM64 Windows machines (free for public
  # repos), so this job both builds natively -- the codegen tools run on the
  # host, no cross-compilation split needed -- and executes the headless test
  # suite on real ARM64 Windows. The resulting artifact is the ARM binary.
  clang-arm64:
    runs-on: windows-11-arm

    defaults:
      run:
        shell: msys2 {0}
        working-directory: src

    steps:
      - uses: actions/checkout@v5

      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: false
          install: >-
            mingw-w64-clang-aarch64-clang
            mingw-w64-clang-aarch64-cmake
            mingw-w64-clang-aarch64-ninja

      - name: Provide windres name expected by the preset
        run: |
          command -v windres && exit 0
          llvmrc=$(command -v llvm-windres) || { echo "no windres available" >&2; exit 1; }
          cp "$llvmrc" "$(dirname "$llvmrc")/windres.exe"

      - name: Configure
        run: cmake --preset x64-clang-mingw-debug

      - name: Build
        run: |
          set -o pipefail
          cmake --build --preset x64-clang-mingw-debug 2>&1 | tee ../build-arm64.log

      - name: Error summary
        if: failure()
        run: |
          echo "=== error lines ==="
          grep -E "error:|FAILED|undefined reference" ../build-arm64.log | head -60 || true

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-arm64
          path: build-arm64.log
          if-no-files-found: ignore

      - name: Test (headless, native ARM64)
        run: ctest --test-dir ../out-clang-mingw -C Debug --output-on-failure -E '^opus_word1_'

      - name: Test (UI, informational)
        continue-on-error: true
        run: ctest --test-dir ../out-clang-mingw -C Debug --output-on-failure -R '^opus_word1_'

      - name: Upload WORD1-arm64.exe
        uses: actions/upload-artifact@v4
        with:
          name: WORD1-clang-arm64
          path: bin/WORD1.exe
          if-no-files-found: error
